name: Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # The adapter emits an Azure Functions v4 app that requires @azure/functions
      # at runtime but ships no node_modules, and skip_api_build stops Oryx from
      # installing them. Without this the SSR function silently deploys as nothing
      # and every non-prerendered route — /relay included — returns 404.
      - name: Install SSR function dependencies
        run: npm install --omit=dev --prefix build/server

      # The adapter writes staticwebapp.config.json to build/, but the deployed
      # artifact root is build/static, so Azure never reads it there. Copying it in
      # is what makes the route and mimeTypes rules actually take effect.
      - name: Stage Static Web Apps config
        run: cp build/staticwebapp.config.json build/static/staticwebapp.config.json

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The adapter emits the static site and the SSR function already built,
          # so Oryx must not try to build the app a second time.
          app_location: build/static
          api_location: build/server
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Preview Environment
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
